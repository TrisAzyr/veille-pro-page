<style>
/* Design « D · Nuit violette » */
/* Thèmes : « Clair » (par défaut), « Sombre », « Style vidéo » — sélecteur dans la barre du haut */
:root{
  --radius-lg:18px; --radius-md:14px; --radius-sm:12px;
  --font:"Inter","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[data-theme="sombre"]{
  --bg: radial-gradient(1200px 700px at 15% -10%, #2a1f5c 0%, transparent 60%),
        radial-gradient(900px 600px at 100% 100%, #1b2a5e 0%, transparent 55%), #0b1024;
  --panel: rgba(255,255,255,.06); --card: rgba(255,255,255,.09); --card-2: rgba(255,255,255,.13);
  --border: rgba(255,255,255,.10); --text:#e8eaf6; --muted:#9aa3c7; --nav-text:#c9cdea;
  --accent:#8b7cf6; --accent-2:#5b8def; --accent-soft:#b9adff; --accent-bg: rgba(139,124,246,.18);
  --ok:#34d399; --ok-f:rgba(52,211,153,.14); --warn:#fbbf24; --warn-f:rgba(251,191,36,.14);
  --ko:#fb7185; --ko-f:rgba(251,113,133,.14); --info:#7dd3fc; --info-f:rgba(125,211,252,.14);
  --shadow: 0 10px 30px rgba(0,0,0,.35); --shadow-hover: 0 18px 40px rgba(0,0,0,.5);
  --input: rgba(255,255,255,.05); --menu-bg: rgba(22,26,54,.96); --scheme: dark;
}
[data-theme="clair"]{
  --bg: linear-gradient(135deg, #5b3fd6 0%, #8b6cf2 35%, #c4b2fb 70%, #ece6ff 100%);
  --panel: rgba(255,255,255,.55); --card: rgba(255,255,255,.80); --card-2: rgba(255,255,255,.92);
  --border: rgba(255,255,255,.6); --text:#24164f; --muted:#62558f; --nav-text:#3d2f72;
  --accent:#6a4be0; --accent-2:#9b6cf5; --accent-soft:#5b3fd6; --accent-bg: rgba(124,92,240,.15);
  --ok:#047857; --ok-f:rgba(5,150,105,.13); --warn:#b45309; --warn-f:rgba(217,119,6,.14);
  --ko:#e11d48; --ko-f:rgba(225,29,72,.11); --info:#0369a1; --info-f:rgba(2,132,199,.12);
  --shadow: 0 10px 30px rgba(60,30,140,.16); --shadow-hover: 0 18px 40px rgba(60,30,140,.28);
  --input: rgba(255,255,255,.55); --menu-bg: rgba(255,255,255,.96); --scheme: light;
}
[data-theme="video"]{
  --bg: linear-gradient(135deg, #0e7fd6 0%, #38a8f0 35%, #8fd0fb 70%, #cfeafe 100%);
  --panel: rgba(255,255,255,.55); --card: rgba(255,255,255,.78); --card-2: rgba(255,255,255,.92);
  --border: rgba(255,255,255,.6); --text:#0f2540; --muted:#4f6b88; --nav-text:#1c3a5c;
  --accent:#0f2540; --accent-2:#1490e8; --accent-soft:#0b6fc0; --accent-bg: rgba(20,144,232,.14);
  --ok:#047857; --ok-f:rgba(5,150,105,.13); --warn:#b45309; --warn-f:rgba(217,119,6,.14);
  --ko:#e11d48; --ko-f:rgba(225,29,72,.11); --info:#0369a1; --info-f:rgba(2,132,199,.12);
  --shadow: 0 10px 30px rgba(10,60,120,.15); --shadow-hover: 0 18px 40px rgba(10,60,120,.25);
  --input: rgba(255,255,255,.55); --menu-bg: rgba(255,255,255,.96); --scheme: light;
}
*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-height:100vh;background:var(--bg);background-attachment:fixed;color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;transition:color .4s}
a{color:var(--accent-soft)} a:hover{color:var(--accent-2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;max-width:100%;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=date]{color-scheme:var(--scheme)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;vertical-align:-3px}
textarea{width:100%;min-height:80px;resize:vertical}
svg{flex:none}

.page{min-height:100vh;padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
.app{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.colonne{display:flex;flex-direction:column;gap:20px;min-width:0}
.glass{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
  backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:var(--shadow)}
/* Barre du haut */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 12px;position:relative;z-index:6}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:999px;background:var(--input);border:1px solid var(--border);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;padding:0;font:inherit;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
kbd{font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--border);color:var(--muted);font-family:inherit}
.switcher{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--input);border:1px solid var(--border);flex:none}
.switcher button{padding:7px 12px;border-radius:999px;font-size:13px;color:var(--muted);border:0;background:none;white-space:nowrap;transition:all .25s}
.switcher button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.marque-mobile{display:none}
/* Cartes de statistiques */
.stats-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat-top{display:block;width:100%;padding:18px;transition:transform .2s ease,box-shadow .2s ease;text-align:left;color:var(--text);font:inherit;cursor:pointer}
.stat-top:hover{transform:translateY(-5px);box-shadow:var(--shadow-hover)}
.stat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.stat-title{font-size:13px;color:var(--muted)}
.stat-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.stat-value{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em;margin:2px 0 6px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat-change{display:block;font-size:12.5px;color:var(--muted)}
.stat-change.bon{color:var(--ok)} .stat-change.alerte{color:var(--ko)}
/* Icônes colorées des catégories */
.c-fisc{background:linear-gradient(135deg,#8b5cf6,#6366f1)} .c-soc{background:linear-gradient(135deg,#ec4899,#f43f5e)}
.c-compta{background:linear-gradient(135deg,#0ea5e9,#3b82f6)} .c-jur{background:linear-gradient(135deg,#f59e0b,#f97316)}
.c-eco{background:linear-gradient(135deg,#10b981,#14b8a6)} .c-tech{background:linear-gradient(135deg,#64748b,#475569)}
.c-agri{background:linear-gradient(135deg,#65a30d,#16a34a)} .c-sun{background:linear-gradient(135deg,#f97316,#dc2626)}
.cat-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.cat-icon svg{width:18px;height:18px}
/* Onglets Tout / Non lus / Favoris */
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--input);border:1px solid var(--border);width:fit-content;max-width:100%;overflow-x:auto}
.tab{padding:7px 14px;border-radius:999px;font-size:13px;color:var(--muted);border:0;background:none;white-space:nowrap;transition:all .2s}
.tab.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
[data-theme="video"] .tab.on{background:#0f2540;color:#fff}
/* Apparition en cascade et survol */
.reveal{opacity:0;transform:translateY(16px)}
.reveal.in{opacity:1;transform:none;transition:opacity .5s ease-out,transform .5s ease-out}
.article,.ech{transition:transform .2s,box-shadow .2s}
.article:hover,.ech:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
@media (prefers-reduced-motion: reduce){
  .reveal{opacity:1;transform:none}
  *,*::before,*::after{transition:none!important;animation:none!important}
  .stat-top:hover,.article:hover,.ech:hover{transform:none}
}

/* En-tête */
.nav .brand{padding:4px 6px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
[data-theme="video"] .logo{background:linear-gradient(135deg,#0f2540,#1490e8)}
.brand-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand-title{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand-sub{font-size:12px;color:var(--muted)}
.brand-sub.alerte{color:var(--warn);font-weight:600}
.actions{display:flex;align-items:center;gap:6px;position:relative}
.icon-btn{width:44px;height:44px;border-radius:var(--radius-sm);border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;position:relative}
.icon-btn:hover{background:var(--accent-bg)}
.icon-btn.petit{width:36px;height:36px}
.icon-btn .pastille{position:absolute;top:6px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--ko);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.avatar{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:700;font-size:16px;margin-left:6px}
.menu{position:absolute;right:0;top:52px;z-index:10;background:var(--menu-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px;min-width:230px;box-shadow:0 12px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:4px}
.menu .info{font-size:13px;color:var(--muted);padding:6px 10px}
.menu button{background:transparent;border:0;border-radius:10px;text-align:left;padding:10px;color:var(--nav-text)}
.menu button:hover{background:var(--accent-bg)}
.menu button.actif{color:var(--accent-soft);font-weight:600}
.menu.alertes{width:min(360px,calc(100vw - 32px));gap:8px}
.alerte-item{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px}
.alerte-item.erreur,.alerte-item.retard{border-left-color:var(--ko)}
.alerte-item b{font-size:14px}
.ech-liste{display:flex;flex-direction:column;gap:8px}
.ech{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-left:5px solid var(--ok);border-radius:var(--radius-md);padding:10px 14px 10px 10px}
.ech.proche{border-left-color:var(--warn)} .ech.urgente{border-left-color:var(--ko);background:color-mix(in srgb,var(--ko) 9%,var(--card))}
.ech-date{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-2);border-radius:12px;padding:6px 0;line-height:1.05}
.ech-jour{font-size:24px;font-weight:800}
.ech-mois{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--accent-soft)}
.ech-sem{font-size:11px;color:var(--muted)}
.ech-corps{display:flex;flex-direction:column;gap:3px;min-width:0}
.ech-titre{font-size:15px;font-weight:600;line-height:1.3}
.ech-titre a,.lien-titre{color:var(--text);text-decoration:none;background:none;border:0;padding:0;font:inherit;text-align:left;cursor:pointer}
.ech-titre a:hover,.lien-titre:hover{color:var(--accent-soft);text-decoration:underline}
.ech-sous{font-size:13px;color:var(--muted)}
.ech-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.ech-j{font-size:15px;font-weight:800;white-space:nowrap;color:var(--ok)}
.ech.proche .ech-j{color:var(--warn)} .ech.urgente .ech-j{color:var(--ko)}
.ech-groupe{margin:8px 0 0;font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media (max-width:760px){ .ech{grid-template-columns:52px 1fr;padding:10px} .ech-j{grid-column:2;font-size:13px} .ech-jour{font-size:20px} }
.resume-matin{white-space:pre-wrap;max-height:16em;overflow:auto}
.alerte-detail{font-size:13px;color:var(--muted);white-space:pre-wrap;max-height:9em;overflow:auto}
.alerte-item button{align-self:flex-start;padding:4px 0;color:var(--accent-soft);font-weight:600}
.icon-btn.cloche-erreur{color:var(--ko)}

/* Mise en page */


/* Navigation */
.nav{padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;scrollbar-width:thin}
.nav-title{font-size:11px;font-weight:600;padding:14px 10px 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav-title:first-child{padding-top:0}
.cat{min-height:40px;border-radius:var(--radius-sm);border:0;padding:0 10px;display:flex;align-items:center;gap:10px;font-size:14px;text-align:left;background:transparent;color:var(--muted);font-weight:500;transition:background .2s,color .2s}
.cat svg{width:18px;height:18px}
.cat:hover{background:var(--accent-bg);color:var(--text)}
.cat.is-active{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.cat .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .nb{font-size:11px;font-weight:600;background:var(--accent-bg);color:var(--accent-soft);border-radius:999px;padding:2px 7px}

.cat .nb.urgent{background:var(--ko);color:#fff}
.reset{margin-top:14px;height:40px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--input);color:var(--text);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}

/* Contenu */
.main{min-width:0;padding:22px;display:flex;flex-direction:column;gap:12px}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px 2px;flex-wrap:wrap}
.list-title{font-size:20px;font-weight:700;letter-spacing:-.01em}
.list-count{font-size:13px;color:var(--muted)}
.outils{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 4px}
.outils input[type=search]{flex:1;min-width:180px}
.puce{border:1px solid var(--border);background:var(--input);color:var(--nav-text);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.puce:hover{border-color:var(--accent)}
.puce.is-active{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
.lien-btn{background:none;border:0;color:var(--accent-soft);font-size:13px;padding:6px}
.check{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.bandeau{border-radius:var(--radius-md);padding:10px 14px;font-size:14px;font-weight:600}
.bandeau.demo{background:var(--warn-f);color:var(--warn)}
.bandeau.erreur{background:var(--ko-f);color:var(--ko)}
.empty{padding:48px 16px;text-align:center;color:var(--muted);font-size:15px}

/* Carte article */
.article{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px}
.article.is-read .article-title{color:var(--nav-text);font-weight:600}
.article-row{display:flex;gap:18px;align-items:stretch}
.article-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:2px}
.article-title{font-size:15.5px;font-weight:600;line-height:1.3;color:var(--text);text-decoration:none}
.article-title:hover{color:var(--accent-soft)}
.article-summary{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.article-cat{font-size:12px;font-weight:600;color:var(--accent-soft);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.article-cat .doux{color:var(--muted);font-weight:500}
.article-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px}
.article-meta{display:flex;align-items:center;gap:10px}
.article-when{font-size:13px;color:var(--muted);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:transparent}
.dot.is-unread{background:var(--accent)}
.side-btns{display:flex;gap:2px}
.save.is-saved{color:#f59e0b}
.save.is-saved svg{fill:currentColor}
.note{font-size:13px;color:var(--nav-text);background:var(--card-2);border-radius:10px;padding:8px 10px;white-space:pre-wrap}
.panneau{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.panneau .ligne{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--border);background:var(--card-2);color:var(--text);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primaire{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
.btn.danger{color:var(--ko)}
.btn.danger:hover{border-color:var(--ko)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--card-2);color:var(--muted)}
.b-ok{background:var(--ok-f);color:var(--ok)} .b-warn{background:var(--warn-f);color:var(--warn)}
.b-ko{background:var(--ko-f);color:var(--ko)} .b-info{background:var(--info-f);color:var(--info)}
.b-accent{background:var(--accent-bg);color:var(--accent-soft)}
.etoiles{color:var(--warn);letter-spacing:-1px}

/* Aides */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px}
.stat b{font-size:28px;font-weight:700;display:block;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.cal-wrap{position:relative;max-width:100%;overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md)}
.cal{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.cal th,.cal td{border-bottom:1px solid var(--border);padding:0;height:34px;text-align:center}
.cal thead th{color:var(--muted);font-weight:700;padding:8px 2px}
.cal tbody th{text-align:left;font-weight:500;padding:0 10px;white-space:nowrap;color:var(--text)}
.cal td{min-width:28px;border-left:1px solid var(--border)}
.cal td.s{background:color-mix(in srgb,var(--ok) 55%,transparent)}
.cal td.r{background:color-mix(in srgb,var(--warn) 60%,transparent)}
.cal td.sr{background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 55%,transparent) 50%,color-mix(in srgb,var(--warn) 60%,transparent) 50%)}
.cal .now{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
.cal thead th.now{color:var(--accent-soft)}
.cal tbody tr:last-child th,.cal tbody tr:last-child td{border-bottom:0}
.cal-legende{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.cal-legende span{display:flex;align-items:center;gap:6px}
.cal-legende i{display:inline-block;width:14px;height:14px;border-radius:4px}
.cal-legende i.s{background:color-mix(in srgb,var(--ok) 55%,transparent)}

details>summary{cursor:pointer;color:var(--accent-soft);font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px}

dt{color:var(--muted)} dd{margin:0;white-space:pre-wrap}

/* Connexion */

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

const urlSure = u => /^https?:\/\//i.test(u || '') ? esc(u) : '#';

const parseD = s => { const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y, m-1, d); };

  if (!ts) return 'jamais';

  if (m < 36 * 60) return `il y a ${Math.round(m / 60)} h`;
  return `il y a ${Math.round(m / 1440)} j`;
};
const maj1 = s => s.charAt(0).toUpperCase() + s.slice(1);

// ------------------------------------------------------------------ accès aux données
function apiSupabase(sb, vid){
  const chk = r => { if (r.error) throw r.error; return r.data; };
  return {
    async charger(){
      const [th, ar, ai, jo] = await Promise.all([
        sb.from('themes').select('*').eq('veille_id', vid).order('ordre').order('nom'),
        sb.from('articles').select('*').eq('veille_id', vid).order('created_at', { ascending: false }).limit(1500),
        sb.from('aides').select('*, aides_periodes(*), aides_historique(*)').eq('veille_id', vid).order('nom'),
        sb.from('journal_collecte').select('*').eq('veille_id', vid).order('debut', { ascending: false }).limit(20)
      ]);
      return { themes: chk(th), articles: chk(ar), aides: chk(ai), journal: chk(jo) };
    },
    majArticle: async (id, p) => chk(await sb.from('articles').update(p).eq('id', id)),
    supprimerArticle: async id => chk(await sb.from('articles').delete().eq('id', id)),
    majAide: async (id, p) => chk(await sb.from('aides').update(p).eq('id', id)),
    sauverTheme: async t => t.id
      ? chk(await sb.from('themes').update({ nom: t.nom, consignes: t.consignes, actif: t.actif }).eq('id', t.id))
      : chk(await sb.from('themes').insert({ veille_id: vid, nom: t.nom, consignes: t.consignes, actif: true })),
    supprimerTheme: async id => chk(await sb.from('themes').delete().eq('id', id))
  };
}

// ------------------------------------------------------------------ logique aides
function statutPeriode(p){
  const t = auj();
  if (p.depot_cloture && p.depot_cloture < t) return 'cloturee';
  if (p.depot_ouverture && p.depot_ouverture > t) return 'a_venir';
  if (p.depot_ouverture || p.depot_cloture) return 'ouverte';
  return 'inconnue';
}
function statutAide(a){
  if (a.statut === 'suspendue') return 'suspendue';
  const st = (a.aides_periodes || []).map(statutPeriode);
  if (st.includes('ouverte')) return 'ouverte';
  if (st.includes('a_venir')) return 'a_venir';
  if (st.length && st.every(s => s === 'cloturee')) return 'fermee';
  return a.statut || 'inconnue';
}
const LIB_STATUT = { ouverte: ['Ouverte','b-ok'], a_venir: ['À venir','b-info'], fermee: ['Clôturée',''], suspendue: ['Suspendue','b-ko'], inconnue: ['À vérifier','b-warn'] };
function prochaineCloture(a){
  const c = (a.aides_periodes || []).filter(p => statutPeriode(p) === 'ouverte' && p.depot_cloture).map(p => p.depot_cloture).sort();
  return c[0] || null;
}

const mouvementReduit = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function animer(){
  const els = [...document.querySelectorAll('.reveal:not(.in)')];
  if (mouvementReduit()) els.forEach(el => el.classList.add('in'));
  else els.forEach((el, i) => setTimeout(() => el.classList.add('in'), 60 + Math.min(i, 14) * 55));
  if (S.compter){
    S.compter = false;
    document.querySelectorAll('.stat-value[data-to]').forEach(el => {
      const fin = +el.dataset.to;
      if (mouvementReduit() || !fin){ el.textContent = fin; return; }
      const t0 = performance.now(), duree = 1100;
      (function pas(t){ const p = Math.min((t - t0) / duree, 1), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(fin * e); if (p < 1) requestAnimationFrame(pas); })(t0);
    });
  }
}

  const erreur = j && String(j.erreurs || '').trim();
  if (erreur) liste.push({ cle: 'erreur', nouvelle: String(j.id) !== store.getItem('veille.erreurVue'),
    titre: 'Erreur signalée par la dernière collecte', detail: `${ilYa(j.debut)} — ${erreur}`, action: 'journal', bouton: 'Voir le journal de l’IA' });
  if (!j || (Date.now() - new Date(j.debut)) > CFG.alerteCollecteHeures * 3600000)
    liste.push({ cle: 'retard', nouvelle: true, titre: 'La collecte quotidienne n’a pas tourné',
      detail: j ? `Dernière collecte ${ilYa(j.debut)}. Vérifier la tâche planifiée « Veille pro quotidienne ».` : 'Aucune collecte enregistrée.', action: 'journal', bouton: 'Voir le journal de l’IA' });
  const urg = periodesUrgentes();

  return liste;
}

// ------------------------------------------------------------------ échéances fiscales récurrentes
// (pas d'échéances sociales : le cabinet ne gère ni la paie, ni la DSN, ni les paiements de cotisations TNS)
// Règles générales (calendrier fiscal impots.gouv.fr) : une date qui tombe un samedi, un dimanche
// ou un jour férié est reportée au premier jour ouvré suivant. Les dates propres à chaque client
// (TVA selon le SIREN, exercice décalé, mensualisation…) restent à vérifier dans l'espace professionnel.
function paques(an){ const a = an % 19, b = Math.floor(an / 100), c = an % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
  g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
  m = Math.floor((a + 11 * h + 22 * l) / 451), mois = Math.floor((h + l - 7 * m + 114) / 31), jour = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(an, mois - 1, jour); }
function feries(an){ const p = paques(an), plus = n => isoLocal(new Date(p.getFullYear(), p.getMonth(), p.getDate() + n));
  return new Set([`${an}-01-01`, plus(1), `${an}-05-01`, `${an}-05-08`, plus(39), plus(50), `${an}-07-14`, `${an}-08-15`, `${an}-11-01`, `${an}-11-11`, `${an}-12-25`]); }
function jourOuvre(an, mois, jour){ const d = new Date(an, mois - 1, jour);
  while (d.getDay() === 0 || d.getDay() === 6 || feries(d.getFullYear()).has(isoLocal(d))) d.setDate(d.getDate() + 1);
  return isoLocal(d); }
const NOM_MOIS = m => MOIS_LONGS[(m + 11) % 12];
const deMois = m => { const n = NOM_MOIS(m); return /^[aeiou]/i.test(n) ? `d’${n}` : `de ${n}`; };
function echeancesRecurrentes(jours){
  const debut = new Date(), fin = new Date(Date.now() + jours * 86400000), out = [];
  const cal = (an, m) => `https://www.impots.gouv.fr/professionnel/calendrier-fiscal/${an}-${String(m).padStart(2, '0')}`;
  for (let d = new Date(debut.getFullYear(), debut.getMonth(), 1); d <= fin; d.setMonth(d.getMonth() + 1)){
    const an = d.getFullYear(), m = d.getMonth() + 1, dePrec = deMois(m - 1), url = cal(an, m);
    const ajout = (jour, titre, sous, type) => out.push({ date: jourOuvre(an, m, jour), titre, sous, type, url, recurrente: true });
    ajout(15, `TVA ${dePrec} — régime réel normal`, 'Dépôt et paiement entre le 15 et le 24, à la date de l’espace professionnel', 'Fiscal');
    ajout(15, `Taxe sur les salaires ${dePrec}`, 'Redevables mensuels (relevé n° 2501)', 'Fiscal');
    if ([3, 6, 9, 12].includes(m)) ajout(15, 'Acompte d’impôt sur les sociétés', 'Relevé d’acompte n° 2571 (exercice calé sur l’année civile)', 'Fiscal');
    if (m === 5) ajout(15, 'Solde d’impôt sur les sociétés', 'Exercice clos le 31 décembre (relevé n° 2572)', 'Fiscal');
    if (m === 6) ajout(15, 'Acompte de CFE', 'Si la CFE de l’an dernier atteint 3 000 € (non mensualisés)', 'Fiscal');
    if (m === 7 || m === 12) ajout(15, `Acompte de TVA ${deMois(m)} — régime simplifié`, 'Entre le 15 et le 24, à la date de l’espace professionnel', 'Fiscal');
    if (m === 12) ajout(15, 'Solde de CFE / IFER', 'Paiement en ligne (non mensualisés, sans prélèvement à l’échéance)', 'Fiscal');
    if (m === 11) ajout(30, 'CFE : adhésion au prélèvement à l’échéance', 'Dernier jour pour opter pour le prélèvement du solde', 'Fiscal');
    if (m === 12) out.push({ date: `${an}-12-31`, titre: 'Déclaration de CFE n° 1447-C', sous: 'Création d’établissement ou changement d’exploitant dans l’année', type: 'Fiscal', url, recurrente: true });
  }
  return out;
}
function toutesEcheances(jours){
  const d = S.data, nomTheme = Object.fromEntries(d.themes.map(t => [t.id, t.nom]));
  return [
    ...echeancesRecurrentes(jours),
    ...d.aides.flatMap(a => (a.aides_periodes || []).filter(p => statutPeriode(p) === 'ouverte' && p.depot_cloture)
      .map(p => ({ date: p.depot_cloture, titre: a.nom, sous: `${p.libelle} — clôture du dépôt`, type: 'Aide', action: 'aides' }))),
    ...d.articles.filter(a => a.date_fin)
      .map(a => ({ date: a.date_fin, titre: a.titre, sous: nomTheme[a.theme_id] || 'Actualité', type: 'Actualité', url: a.url }))
  ].filter(e => { const n = joursJusqua(e.date); return n >= 0 && n <= jours; })
   .sort((a, b) => a.date.localeCompare(b.date) || (a.type === 'Aide' ? -1 : 1));
}
const COUL_TYPE = { Fiscal: 'b-info', Social: 'b-accent', Aide: 'b-ok', 'Actualité': 'b-warn' };
function tuileEcheance(e){
  const n = joursJusqua(e.date), dt = parseD(e.date);
  const urg = n <= 7 ? 'urgente' : n <= CFG.alerteClotureJours ? 'proche' : '';
  const titre = e.url ? `<a href="${urlSure(e.url)}" target="_blank" rel="noopener">${esc(e.titre)}</a>`
    : `<button type="button" class="lien-titre" data-action="vue" data-v="${e.action}">${esc(e.titre)}</button>`;
  return `<div class="ech ${urg}">
    <div class="ech-date"><span class="ech-jour">${dt.getDate()}</span><span class="ech-mois">${esc(dt.toLocaleDateString('fr-FR', { month: 'short' }))}</span><span class="ech-sem">${esc(dt.toLocaleDateString('fr-FR', { weekday: 'short' }))}</span></div>
    <div class="ech-corps"><span class="ech-titre">${titre}</span><span class="ech-sous">${esc(e.sous)}</span>
      <span class="ech-tags"><span class="badge ${COUL_TYPE[e.type] || ''}">${esc(e.type)}</span>${e.recurrente ? '<span class="doux">règle générale</span>' : ''}</span></div>
    <div class="ech-j">${n === 0 ? "Aujourd'hui" : n === 1 ? 'Demain' : `J-${n}`}</div>
  </div>`;
}
function vueEcheances(){
  const jours = S.f.horizon || 60, type = S.f.typeEch || '';

  const parMois = {};

    </div>
    <div class="outils">${[['', 'Tout'], ['Fiscal', 'Fiscal'], ['Aide', 'Aides'], ['Actualité', 'Actualités']].map(([k, l]) => puce('filtre-ech', k, type, l)).join('')}</div>
    <div class="outils">${[[30, '30 jours'], [60, '60 jours'], [90, '3 mois'], [180, '6 mois']].map(([k, l]) => puce('horizon-ech', k, jours, l)).join('')}</div>
    ${Object.keys(parMois).length ? Object.entries(parMois).map(([k, l]) => `<h3 class="ech-groupe">${esc(maj1(parseD(k + '-01').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })))}</h3>
      <div class="ech-liste">${l.map(tuileEcheance).join('')}</div>`).join('') : '<div class="empty">Aucune échéance sur cette période.</div>'}
    <p class="list-count">« Règle générale » : dates du calendrier fiscal courant, reportées au jour ouvré suivant si elles tombent un week-end ou un jour férié. Les dates exactes de chaque client (TVA selon le SIREN, exercice décalé, mensualisation) sont dans son espace professionnel.</p>`;
}

// ------------------------------------------------------------------ vue Accueil
// Résumé du matin + échéances importantes (aides et actualités datées) + nouveautés.
function vueAccueil(){

// ------------------------------------------------------------------ vue Calendrier des cultures
function vueCultures(){
  const d = S.data, moisCourant = new Date().getMonth() + 1;
  const theme = d.themes.find(t => norm(t.nom).includes('calendrier'));
  const suivis = theme ? d.articles.filter(a => a.theme_id === theme.id)
    .sort((a, b) => String(b.date_publication || b.created_at).localeCompare(String(a.date_publication || a.created_at))) : [];
  const nomTheme = Object.fromEntries(d.themes.map(t => [t.id, t.nom]));
  const enCours = CULTURES.filter(c => c.s.includes(moisCourant) || c.r.includes(moisCourant));
  const cellule = (c, m) => {
    const s = c.s.includes(m), r = c.r.includes(m);
    const cls = s && r ? 'sr' : s ? 's' : r ? 'r' : '';
    const lib = s && r ? 'semis et récolte' : s ? 'semis' : r ? 'récolte' : '';
    return `<td class="${cls} ${m === moisCourant ? 'now' : ''}" ${lib ? `title="${esc(c.nom)} : ${lib} en ${MOIS_LONGS[m - 1]}"` : ''}>${lib ? `<span class="sr-only">${lib}</span>` : ''}</td>`;
  };
  return `${tete('Calendrier des cultures', 'Bourgogne-Franche-Comté')}
    <div class="stats">
      <div class="stat"><b>${esc(MOIS_LONGS[moisCourant - 1])}</b><span>mois en cours</span></div>
      <div class="stat"><b>${enCours.length}</b><span>culture${enCours.length > 1 ? 's' : ''} en chantier ce mois-ci</span></div>
      <div class="stat"><b>${suivis.length}</b><span>point${suivis.length > 1 ? 's' : ''} d’avancement</span></div>
    </div>
    <div class="cal-wrap">
      <table class="cal">
        <caption class="sr-only">Périodes de semis et de récolte par culture</caption>
        <thead><tr><th scope="col">Culture</th>${MOIS_COURTS.map((m, i) => `<th scope="col" class="${i + 1 === moisCourant ? 'now' : ''}" title="${MOIS_LONGS[i]}">${m}</th>`).join('')}</tr></thead>
        <tbody>${CULTURES.map(c => `<tr><th scope="row" title="${esc(c.note)}">${esc(c.nom)}</th>${MOIS_COURTS.map((_, i) => cellule(c, i + 1)).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="cal-legende"><span><i class="s"></i>Semis</span><span><i class="r"></i>Récolte, fauche ou vendange</span><span><i class="now-l"></i>Mois en cours</span></div>
    <p class="list-count">Repères indicatifs pour la plaine (Haute-Saône et Bourgogne-Franche-Comté). Les dates varient selon l’année, la parcelle, la variété et la météo : l’avancement réel est suivi ci-dessous chaque semaine par la veille (FranceAgriMer Céré’Obs, Arvalis, chambres d’agriculture).</p>
    ${enCours.length ? `<div class="article"><span class="sous-titre">En ${esc(MOIS_LONGS[moisCourant - 1])}</span>
      <ul class="historique">${enCours.map(c => `<li><b>${esc(c.nom)}</b> — ${c.s.includes(moisCourant) ? 'semis' : ''}${c.s.includes(moisCourant) && c.r.includes(moisCourant) ? ' et ' : ''}${c.r.includes(moisCourant) ? 'récolte' : ''} : ${esc(c.note)}</li>`).join('')}</ul></div>` : ''}
    ${tete('Avancement des travaux (veille hebdomadaire)', pluriel(suivis.length, 'point', 'points'))}
    ${suivis.length ? suivis.map(a => carteArticle(a, nomTheme)).join('') : '<div class="empty">Pas encore de point d’avancement : la veille en ajoute un par semaine.</div>'}`;
}

// ------------------------------------------------------------------ vue Aides
const estAgricole = a => (a.tags || []).some(t => /agricult|viticult|élevage|elevage/i.test(t));
function vueAides(){
  const toutes = S.data.aides;
  const ouvertes = periodesOuvertes().length, urgentes = periodesUrgentes().length;
  const aVerifier = toutes.filter(a => a.suivre && aideAncienne(a)).length;
  const q = norm(S.f.q);
  const ordre = { ouverte: 0, a_venir: 1, inconnue: 2, suspendue: 3, fermee: 4 };
  const liste = toutes.filter(a => {
    const s = statutAide(a);
    if (S.f.aides === 'actives' && !['ouverte', 'a_venir', 'inconnue'].includes(s)) return false;
    if (S.f.aides === 'ouvertes' && s !== 'ouverte') return false;
    if (S.f.aides === 'fermees' && !['fermee', 'suspendue'].includes(s)) return false;
    if (S.f.secteur === 'agri' && !estAgricole(a)) return false;
    if (S.f.secteur === 'autres' && estAgricole(a)) return false;
    return !q || norm([a.nom, a.organisme, a.description, (a.tags || []).join(' ')].join(' ')).includes(q);
  }).sort((a, b) => (ordre[statutAide(a)] - ordre[statutAide(b)]) || String(prochaineCloture(a) || '9').localeCompare(String(prochaineCloture(b) || '9')) || a.nom.localeCompare(b.nom));
  const puce = (k, l) => `<button type="button" class="puce ${S.f.aides === k ? 'is-active' : ''}" data-action="filtre-aides" data-v="${k}">${l}</button>`;
  return `${tete('Aides et dispositifs', pluriel(liste.length, 'aide', 'aides'))}
    <div class="stats">
      <div class="stat"><b style="color:var(--ok)">${ouvertes}</b><span>période${ouvertes > 1 ? 's' : ''} ouverte${ouvertes > 1 ? 's' : ''}</span></div>
      <div class="stat"><b style="color:${urgentes ? 'var(--ko)' : 'inherit'}">${urgentes}</b><span>clôture ≤ ${CFG.alerteClotureJours} j</span></div>
      <div class="stat"><b style="color:${aVerifier ? 'var(--warn)' : 'inherit'}">${aVerifier}</b><span>à revérifier</span></div>
    </div>
    <div class="outils">${champRecherche('Rechercher une aide…')}
      ${puce('actives', 'En cours')}${puce('ouvertes', 'Ouvertes')}${puce('fermees', 'Clôturées')}${puce('toutes', 'Toutes')}</div>
    <div class="outils">${[['', 'Tous secteurs'], ['agri', `Agricoles (${toutes.filter(estAgricole).length})`], ['autres', `Autres activités (${toutes.filter(a => !estAgricole(a)).length})`]]
      .map(([k, l]) => `<button type="button" class="puce ${(S.f.secteur || '') === k ? 'is-active' : ''}" data-action="filtre-secteur" data-v="${k}">${l}</button>`).join('')}</div>
    ${liste.length ? liste.map(carteAide).join('') : '<div class="empty">Aucune aide dans ce filtre.</div>'}`;
}
function lignePeriode(p){
  const s = statutPeriode(p);
  let jours = '', cls = s;
  if (s === 'ouverte' && p.depot_cloture){
    const n = joursJusqua(p.depot_cloture), urg = n <= CFG.alerteClotureJours;
    if (urg) cls += ' urgente';
    jours = `<span class="jours" style="color:${urg ? 'var(--ko)' : 'var(--ok)'}">${n === 0 ? "Clôture aujourd'hui" : `J-${n}`}</span>`;
  } else if (s === 'ouverte') jours = '<span class="jours" style="color:var(--ok)">ouverte</span>';
  else if (s === 'a_venir' && p.depot_ouverture) jours = `<span class="jours" style="color:var(--info)">ouvre dans ${joursJusqua(p.depot_ouverture)} j</span>`;
  else if (s === 'cloturee') jours = '<span class="jours" style="color:var(--muted)">clôturée</span>';
  const dates = [
    (p.depot_ouverture || p.depot_cloture) ? `Dépôt : ${fr(p.depot_ouverture)} → <b>${fr(p.depot_cloture)}</b>` : 'Dates de dépôt non confirmées',
    (p.periode_debut || p.periode_fin) ? `Période couverte : ${fr(p.periode_debut)} → ${fr(p.periode_fin)}` : '',
    p.taux ? `Taux : ${esc(p.taux)}` : ''
  ].filter(Boolean).join(' · ');
  return `<div class="periode ${cls}">
    <span class="lib">${esc(p.libelle)}</span>${jours}
    <span class="dates">${dates}${p.details ? `<br>${esc(p.details)}` : ''}${p.lien ? ` · <a href="${urlSure(p.lien)}" target="_blank" rel="noopener">lien</a>` : ''}</span>
  </div>`;
}
function carteAide(a){
  const s = statutAide(a), [lib, cls] = LIB_STATUT[s] || LIB_STATUT.inconnue;
  const per = (a.aides_periodes || []).slice().sort((x, y) => String(x.depot_cloture || x.depot_ouverture || '').localeCompare(String(y.depot_cloture || y.depot_ouverture || '')));
  const actives = per.filter(p => statutPeriode(p) !== 'cloturee');
  const closes = per.filter(p => statutPeriode(p) === 'cloturee').reverse();
  const hist = (a.aides_historique || []).slice().sort((x, y) => String(y.date).localeCompare(String(x.date)));
  const champ = (l, v) => v ? `<dt>${l}</dt><dd>${esc(v)}</dd>` : '';
  const idd = 'aide-' + a.id;
  return `<article class="article">
    <div class="article-row">
      <div class="article-body">
        <span class="article-title">${esc(a.nom)}</span>
        ${a.montant ? `<p class="article-summary">${esc(a.montant)}</p>` : ''}
        <span class="article-cat">${esc(a.organisme || '')}${(a.tags || []).map(t => `<span class="doux">#${esc(t)}</span>`).join('')}</span>
      </div>
      <div class="article-side">
        <span class="badge ${cls}">${lib}</span>
        <span class="article-when" style="color:${aideAncienne(a) ? 'var(--warn)' : ''}" title="Dernière vérification par l'IA">vérifiée ${esc(ilYa(a.verifie_le))}</span>
      </div>
    </div>
    <div class="periodes">${actives.length ? actives.map(lignePeriode).join('') : '<span class="article-summary">Aucune période ouverte ou à venir connue.</span>'}</div>
    <details data-id="${esc(idd)}" ${S.ouverts.has(idd) ? 'open' : ''}>
      <summary>Détails, historique et notes</summary>
      <div class="details-corps">
        <dl>${champ('Description', a.description)}${champ('Bénéficiaires', a.beneficiaires)}${champ('Conditions', a.conditions)}</dl>
        <div class="panneau ligne" style="border:0;padding:0;flex-direction:row;flex-wrap:wrap;gap:14px">
          ${a.lien_officiel ? `<a href="${urlSure(a.lien_officiel)}" target="_blank" rel="noopener">Page officielle ↗</a>` : ''}
          ${a.lien_demarche ? `<a href="${urlSure(a.lien_demarche)}" target="_blank" rel="noopener">Faire la démarche ↗</a>` : ''}
          ${(a.sources_verification || []).map((u, i) => `<a href="${urlSure(u)}" target="_blank" rel="noopener">Source ${i + 1}</a>`).join('')}
        </div>
        ${closes.length ? `<p class="sous-titre">Périodes clôturées</p><div class="periodes">${closes.map(lignePeriode).join('')}</div>` : ''}
        ${hist.length ? `<p class="sous-titre">Historique des changements</p><ul class="historique">${hist.slice(0, 15).map(h => `<li>${fr(h.date)} — ${esc(h.changement)}${h.source ? ` (<a href="${urlSure(h.source)}" target="_blank" rel="noopener">source</a>)` : ''}</li>`).join('')}</ul>` : ''}
        <p class="sous-titre">Mes notes <span style="text-transform:none;font-weight:500">— l'IA n'y touche pas</span></p>
        <textarea id="note-aide-${esc(a.id)}" placeholder="Ma note…">${esc(a.notes)}</textarea>
        <div class="ligne" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
          <button type="button" class="btn" data-action="aide-note" data-id="${esc(a.id)}">Enregistrer la note</button>
          <label class="check"><input type="checkbox" data-change="aide-suivre" data-id="${esc(a.id)}" ${a.suivre ? 'checked' : ''}> L'IA continue de la vérifier</label>
        </div>
      </div>
    </details>
  </article>`;
}

// ------------------------------------------------------------------ vue Actualités
function quand(a){
  const d = a.date_publication;
  if (!d || d === auj() || d === isoLocal(new Date(a.created_at))) return maj1(ilYa(a.created_at));
  return frCourt(d);
}
function vueArticles(conservees){
  const d = S.data, q = norm(S.f.q);
  const nomTheme = Object.fromEntries(d.themes.map(t => [t.id, t.nom]));
  const liste = d.articles.filter(a =>
    (!conservees || a.conserver) &&
    (conservees || !S.f.theme || a.theme_id === S.f.theme) &&
    (conservees || !S.f.nonLus || !a.lu) &&
    (!q || norm([a.titre, a.resume, a.source, a.notes, (a.tags || []).join(' ')].join(' ')).includes(q))
  );
  const titre = conservees ? 'Favoris' : S.f.theme ? (nomTheme[S.f.theme] || 'Thème') : 'Dernières actualités';
  const onglet = conservees ? 'favoris' : S.f.nonLus ? 'nonlus' : 'tout';
  const nonLus = liste.filter(a => !a.lu).length;
  return `${tete(titre, pluriel(liste.length, 'article', 'articles') + (nonLus && !conservees ? ` · ${nonLus} non lu${nonLus > 1 ? 's' : ''}` : ''))}
    <div class="outils">
      <div class="tabs" role="tablist">${[['tout', 'Tout'], ['nonlus', 'Non lus'], ['favoris', 'Favoris']].map(([k, l]) => `<button type="button" role="tab" class="tab ${onglet === k ? 'on' : ''}" aria-selected="${onglet === k}" data-action="onglet" data-v="${k}">${l}</button>`).join('')}</div>
      ${!conservees && nonLus ? '<button type="button" class="lien-btn" data-action="tout-lu">Tout marquer lu</button>' : ''}
    </div>
    ${liste.length ? liste.map(a => carteArticle(a, nomTheme)).join('')
      : `<div class="empty">${conservees ? 'Aucun favori. Utilise l’étoile pour garder une actualité sans limite de durée.' : 'Aucun article pour ce filtre.'}</div>`}`;
}
function carteArticle(a, nomTheme){
  const purge = ajouterJours(a.created_at, CFG.joursAvantPurge);
  const n = joursJusqua(a.date_fin && a.date_fin > purge ? a.date_fin : purge);
  const devenir = a.conserver ? 'Conservée sans limite'
    : a.date_fin && a.date_fin >= purge ? `Gardée jusqu'au ${fr(a.date_fin)}`
    : `Suppression automatique ${n <= 0 ? 'cette nuit' : `dans ${n} j`}`;
  const echeanceProche = a.date_fin && joursJusqua(a.date_fin) >= 0 && joursJusqua(a.date_fin) <= CFG.alerteClotureJours;
  const idp = 'art-' + a.id;
  const st = styleTheme(nomTheme[a.theme_id] || '');
  return `<article class="article ${a.lu ? 'is-read' : ''}">
    <div class="article-row">
      <span class="cat-icon ${st.cls}" aria-hidden="true">${st.ico}</span>
      <div class="article-body">
        <a class="article-title" href="${urlSure(a.url)}" target="_blank" rel="noopener" data-action="ouvrir" data-id="${esc(a.id)}">${esc(a.titre)}</a>
        ${a.resume ? `<p class="article-summary">${esc(a.resume)}</p>` : ''}
        <span class="article-cat">
          ${a.theme_id && nomTheme[a.theme_id] ? `<span>${esc(nomTheme[a.theme_id])}</span>` : ''}
          ${a.importance ? `<span class="etoiles" title="Importance">${'★'.repeat(a.importance)}</span>` : ''}
          ${a.source ? `<span class="doux">${esc(a.source)}</span>` : ''}
          ${a.date_fin ? `<span class="badge ${echeanceProche ? 'b-warn' : 'b-accent'}">Échéance ${fr(a.date_fin)}</span>` : ''}
          ${(a.tags || []).map(t => `<span class="doux">#${esc(t)}</span>`).join('')}
        </span>
        ${a.notes ? `<div class="note">${esc(a.notes)}</div>` : ''}
      </div>
      <div class="article-side">
        <div class="article-meta">
          <span class="article-when">${esc(quand(a))}</span>
          <span class="dot ${a.lu ? '' : 'is-unread'}">${a.lu ? '' : '<span class="sr-only">Non lu</span>'}</span>
        </div>
        <div class="side-btns">
          <button type="button" class="icon-btn petit save ${a.conserver ? 'is-saved' : ''}" data-action="conserver" data-id="${esc(a.id)}" aria-pressed="${a.conserver}" aria-label="${a.conserver ? 'Retirer des favoris' : 'Ajouter aux favoris (gardé sans limite)'}" title="${a.conserver ? 'Retirer des favoris' : 'Ajouter aux favoris (gardé sans limite)'}">${ICO.star}</button>
          <button type="button" class="icon-btn petit" data-action="plus" data-id="${esc(a.id)}" aria-expanded="${S.ouverts.has(idp)}" aria-label="Plus d'actions" title="Plus d'actions">${ICO.more}</button>
        </div>
      </div>
    </div>
    ${S.ouverts.has(idp) ? `<div class="panneau">
      <div class="ligne">
        <button type="button" class="btn" data-action="lu" data-id="${esc(a.id)}">${a.lu ? 'Marquer non lu' : 'Marquer lu'}</button>
        <label class="check">Garder jusqu'au <input type="date" data-change="date-fin" data-id="${esc(a.id)}" value="${esc(a.date_fin || '')}"></label>
        ${a.date_fin ? `<button type="button" class="lien-btn" data-action="sans-date" data-id="${esc(a.id)}">retirer la date</button>` : ''}
        <span class="list-count" style="margin-left:auto">${devenir}</span>
      </div>
      <textarea id="note-art-${esc(a.id)}" placeholder="Ma note…">${esc(a.notes)}</textarea>
      <div class="ligne">
        <button type="button" class="btn primaire" data-action="note-art" data-id="${esc(a.id)}">Enregistrer la note</button>
        <button type="button" class="btn danger" data-action="supprimer" data-id="${esc(a.id)}" style="margin-left:auto;display:flex;gap:6px;align-items:center">${ICO.trash}Supprimer</button>
      </div>
    </div>` : ''}
  </article>`;
}

      <div class="article-side">
        ${x.nb_articles != null ? `<span class="badge b-accent">${pluriel(x.nb_articles, 'actu', 'actus')}</span>` : ''}
        ${x.nb_aides != null ? `<span class="badge b-ok">${pluriel(x.nb_aides, 'aide vérifiée', 'aides vérifiées')}</span>` : ''}
      </div>
    </div>
    ${x.suggestions ? `<div class="note"><b style="color:var(--accent-soft)">Suggestions d'amélioration</b>\n${esc(x.suggestions)}</div>` : ''}
    ${x.erreurs ? `<div class="note erreur">${esc(x.erreurs)}</div>` : ''}
  </article>`).join(''));
}

// ------------------------------------------------------------------ connexion
function renderConnexion(){
  const v = S.veille;
  $app.innerHTML = `<div class="page"><form class="connexion" data-form="connexion">
    <div class="brand">${ICO.logo}<div class="brand-text"><span class="brand-title">${esc(v.nom)}</span><span class="brand-sub">${esc(v.sousTitre || 'Connexion')}</span></div></div>
    ${CFG.veilles.length > 1 ? `<select data-change="veille-select" aria-label="Veille">${CFG.veilles.map(x => `<option value="${esc(x.id)}" ${x.id === v.id ? 'selected' : ''}>${esc(x.nom)}</option>`).join('')}</select>` : ''}
    <input type="email" name="email" placeholder="E-mail" autocomplete="username" required>
    <input type="password" name="mdp" placeholder="Mot de passe" autocomplete="current-password" required>
    <button class="btn primaire" type="submit">Se connecter</button>
    ${S.erreur ? `<div class="erreur">${esc(S.erreur)}</div>` : ''}
    <a href="?demo" style="font-size:14px;text-align:center">Voir la démonstration</a>
  </form></div>`;
}
function renderMessage(titre, html){
  $app.innerHTML = `<div class="page"><div class="connexion"><div class="brand">${ICO.logo}<div class="brand-text"><span class="brand-title">${esc(titre)}</span></div></div>${html}</div></div>`;
}

// ------------------------------------------------------------------ actions
async function action(fn, okMsg){
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) { console.error(e); toast('Erreur : ' + (e.message || e)); await charger(); }
}
const art = id => S.data.articles.find(a => a.id === id);
const aide = id => S.data.aides.find(a => a.id === id);
async function majArticleLocal(id, patch, msg){
  Object.assign(art(id), patch); render();
  await action(() => S.api.majArticle(id, patch), msg);
}
function allerA(vue, theme = ''){
  S.vue = vue; S.f.theme = theme; store.setItem('veille.vue', vue);
  S.animer = true; render();
  if (window.innerWidth <= 760) document.getElementById('contenu')?.scrollIntoView({ block: 'start', behavior: 'smooth' });
  else window.scrollTo(0, 0);
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (S.menu && !e.target.closest('.menu') && el?.dataset.action !== 'menu') { S.menu = false; render(); if (!el) return; }
  if (S.alertes && !e.target.closest('.alertes') && el?.dataset.action !== 'alertes') { S.alertes = false; render(); if (!el) return; }
  if (!el) return;
  const id = el.dataset.id, A = el.dataset.action;
  switch (A){
    case 'vue': allerA(el.dataset.v, el.dataset.theme || ''); break;
    case 'style': appliquerStyle(el.dataset.v); render(); break;
    case 'onglet': {
      const t = el.dataset.v, theme = S.vue === 'actus' ? S.f.theme : '';
      if (t === 'favoris') allerA('conservees');
      else { S.f.nonLus = t === 'nonlus'; allerA('actus', theme); }
      break;
    }
    case 'stat-vue': {
      const v = el.dataset.v;
      if (v === 'nonlus') { S.f.nonLus = true; allerA('actus'); }
      else { if (v === 'actus') S.f.nonLus = false; if (v === 'aides') S.f.aides = 'ouvertes'; allerA(v); }
      break;
    }
    case 'reset': S.f = { q: '', theme: '', nonLus: false, aides: 'actives' }; S.recherche = false; allerA(S.vue === 'conservees' ? 'actus' : S.vue); break;
    case 'recherche':
      S.recherche = !S.recherche; if (!S.recherche) S.f.q = '';
      if (!['aides', 'actus', 'conservees'].includes(S.vue)) S.vue = 'actus';
      render(); document.querySelector('[data-input="q"]')?.focus(); break;
    case 'alertes': {
      S.alertes = !S.alertes; S.menu = false;
      const j = S.data.journal[0];
      if (S.alertes && j && String(j.erreurs || '').trim()) store.setItem('veille.erreurVue', String(j.id));
      render(); break;
    }
    case 'alerte-ouvrir': S.alertes = false; if (el.dataset.v === 'aides') S.f.aides = 'ouvertes'; allerA(el.dataset.v); break;
    case 'menu': S.menu = !S.menu; S.alertes = false; render(); break;
    case 'veille': S.menu = false; store.setItem('veille.courante', el.dataset.v); demarrer(); break;
    case 'quitter-demo': location.href = location.pathname; break;
    case 'filtre-aides': S.f.aides = el.dataset.v; majContenu(); break;
    case 'filtre-secteur': S.f.secteur = el.dataset.v; majContenu(); break;
    case 'filtre-ech': S.f.typeEch = el.dataset.v; majContenu(); break;
    case 'horizon-ech': S.f.horizon = Number(el.dataset.v); majContenu(); break;
    case 'nonlus': S.f.nonLus = !S.f.nonLus; majContenu(); break;
    case 'rafraichir': await charger(); toast('À jour'); break;
    case 'deconnexion': S.menu = false; await S.sb.auth.signOut(); S.user = null; render(); break;
    case 'ouvrir': if (!art(id).lu) setTimeout(() => majArticleLocal(id, { lu: true }), 0); break; // le lien s'ouvre normalement
    case 'plus': { const k = 'art-' + id; S.ouverts.has(k) ? S.ouverts.delete(k) : S.ouverts.add(k); majContenu(); break; }
    case 'lu': majArticleLocal(id, { lu: !art(id).lu }); break;
    case 'conserver': majArticleLocal(id, { conserver: !art(id).conserver }, art(id).conserver ? 'Retirée des favoris' : 'Ajoutée aux favoris'); break;
    case 'tout-lu': {
      const ids = S.data.articles.filter(a => !a.lu && (!S.f.theme || a.theme_id === S.f.theme)).map(a => a.id);
      ids.forEach(i => art(i).lu = true); render();
      await action(() => Promise.all(ids.map(i => S.api.majArticle(i, { lu: true }))), 'Tout est marqué lu');
      break;
    }
    case 'supprimer':
      if (!confirm('Supprimer définitivement cette actualité ?')) return;
      S.data.articles = S.data.articles.filter(a => a.id !== id); render();
      await action(() => S.api.supprimerArticle(id), 'Supprimée');
      break;
    case 'sans-date': majArticleLocal(id, { date_fin: null }, 'Date retirée'); break;
    case 'note-art': majArticleLocal(id, { notes: document.getElementById('note-art-' + id).value.trim() || null }, 'Note enregistrée'); break;
    case 'aide-note': {
      const notes = document.getElementById('note-aide-' + id).value.trim() || null;
      aide(id).notes = notes;
      await action(() => S.api.majAide(id, { notes }), 'Note enregistrée');
      break;
    }
    case 'theme-sauver': {
      const k = id || 'new';
      const nom = document.getElementById('th-nom-' + k).value.trim();
      if (!nom) return toast('Le nom est obligatoire');
      const t = { id: id || null, nom, consignes: document.getElementById('th-cons-' + k).value.trim() || null,
        actif: id ? document.getElementById('th-actif-' + k).checked : true };
      await action(() => S.api.sauverTheme(t), 'Thème enregistré'); await charger();
      break;
    }
    case 'theme-suppr':
      if (!confirm('Supprimer ce thème ? Les actus associées restent, sans thème.')) return;
      await action(() => S.api.supprimerTheme(id), 'Thème supprimé'); await charger();
      break;
  }
});

document.addEventListener('change', async e => {
  const el = e.target, C = el.dataset.change; if (!C) return;
  const id = el.dataset.id;
  if (C === 'veille-select') { store.setItem('veille.courante', el.value); return demarrer(); }
  if (C === 'date-fin') return majArticleLocal(id, { date_fin: el.value || null }, el.value ? `Gardée jusqu'au ${fr(el.value)}` : 'Date retirée');
  if (C === 'aide-suivre') { aide(id).suivre = el.checked; return action(() => S.api.majAide(id, { suivre: el.checked }), el.checked ? "L'IA vérifiera cette aide" : "L'IA ne vérifiera plus cette aide"); }
});

document.addEventListener('input', e => {
  if (e.target.dataset.input !== 'q') return;
  S.f.q = e.target.value;
  const pos = e.target.selectionStart;
  if (!['aides', 'actus', 'conservees'].includes(S.vue)) { S.vue = 'actus'; S.f.theme = ''; store.setItem('veille.vue', 'actus'); render(); }
  else majContenu();
  const nouv = document.querySelector('[data-input="q"]');
  if (nouv) { nouv.focus(); nouv.setSelectionRange(pos, pos); }
});

document.addEventListener('toggle', e => {
  const d = e.target; if (d.tagName !== 'DETAILS' || !d.dataset.id) return;
  d.open ? S.ouverts.add(d.dataset.id) : S.ouverts.delete(d.dataset.id);
}, true);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (S.menu || S.alertes)) { S.menu = false; S.alertes = false; render(); }
  const q = document.querySelector('[data-input="q"]');
  if (e.key === '/' && q && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) { e.preventDefault(); q.focus(); }
});

document.addEventListener('submit', async e => {
  if (e.target.dataset.form !== 'connexion') return;
  e.preventDefault();
  const f = new FormData(e.target);
  S.erreur = '';
  const { data, error } = await S.sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('mdp') });
  if (error) { S.erreur = 'Connexion impossible : ' + error.message; return render(); }
  S.user = data.user;
  await charger();
});

// ------------------------------------------------------------------ démarrage
async function charger(){
  S.chargement = !S.data.aides.length && !S.data.articles.length;
  S.erreur = '';
  render();
  try { S.data = await S.api.charger(); }
  catch (e) {
    console.error(e);
    S.erreur = 'Chargement impossible : ' + (e.message || e) +
      (/permission|policy|JWT/i.test(e.message || '') ? " — vérifie que ton e-mail est dans la table utilisateurs_autorises." : '');
  }
  S.chargement = false;
  S.animer = true; S.compter = true;
  render();
}

async function demarrer(){
  const choix = store.getItem('veille.courante');
  S.veille = CFG.veilles.find(v => v.id === choix) || CFG.veilles[0];
  S.data = { themes: [], articles: [], aides: [], journal: [] };
  S.f = { q: '', theme: '', nonLus: false, aides: 'actives' };
  if (DEMO) { S.api = apiDemo(); S.user = { email: 'demo@veille' }; return charger(); }
  if (!window.supabase) return renderMessage('Hors ligne', '<p class="erreur">Impossible de charger Supabase : vérifie la connexion internet.</p>');
  if (/VOTRE-PROJET/.test(S.veille.supabaseUrl)) return renderMessage('Configuration', '<p class="article-summary">Renseigne <code>supabaseUrl</code> et <code>supabaseKey</code> en haut du fichier <code>index.html</code>.</p><a href="?demo">Voir la démonstration</a>');
  S.sb = window.supabase.createClient(S.veille.supabaseUrl, S.veille.supabaseKey, {
    auth: { persistSession: true, autoRefreshToken: true, storage: store, storageKey: 'veille-auth-' + S.veille.id }
  });
  S.api = apiSupabase(S.sb, S.veille.id);
  const { data } = await S.sb.auth.getSession();
  S.user = data.session?.user || null;
  if (S.user) await charger(); else render();
}

demarrer();
})();
</script>
</body>
